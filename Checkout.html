<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout · ThriftNFit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@300;400&family=Playfair+Display:wght@600;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    /* Settings menu (Contacts + Shipping information) */
    .settings { position: relative; }
    .menu { z-index: 1000; }
    .menu[hidden] { display: none !important; }
    .menu a.menu__row {
      display: flex;
      box-sizing: border-box;
      width: 100%;
      text-decoration: none;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
      color: var(--cream);
      font-size: 40px;
      line-height: 1;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 0.7; }

    /* PAGE */
    .checkout {
      min-height: 100vh;
      padding: clamp(108px, 16vh, 170px) clamp(20px, 5vw, 80px) clamp(24px, 4vh, 48px);
      background: radial-gradient(
        ellipse 80% 60% at 50% 35%,
        var(--bg-glow) 0%,
        var(--bg) 55%,
        var(--bg-edge) 100%
      );
      font-family: "Playfair Display", Georgia, serif;
    }
    .checkout__inner { max-width: 1240px; margin: 0 auto; }

    .checkout__title {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.2;
      color: #fff;
    }

    .address-link {
      display: inline-block;
      margin-top: clamp(14px, 3.5vh, 36px);
      font-family: "Oswald", "Arial Narrow", sans-serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .address-link:hover,
    .address-link:focus-visible { color: var(--accent); border-color: var(--accent); }

    .address-text {
      margin-top: 6px;
      max-width: 620px;
      font-size: 14px;
      font-weight: 600;
      color: var(--cream);
      opacity: 0.9;
    }
    .address-text.is-empty { opacity: 0.65; font-weight: 400; }

    /* ORDER TABLE */
    .order-head,
    .order-row {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .order-head { margin-top: clamp(12px, 2.6vh, 28px); }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      height: 32px;
      padding: 0 12px;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .order-head .pill { justify-self: start; }

    .order-row { margin-top: clamp(10px, 2vh, 22px); }
    .order-row + .order-row { padding-top: 14px; border-top: 1px solid var(--line); }

    .item-title {
      font-family: "Oswald", "Arial Narrow", sans-serif;
      font-size: 24px;
      font-weight: 300;
      line-height: 1.15;
      text-transform: uppercase;
      color: #fff;
    }
    .item-size { margin-top: 4px; font-size: 13px; color: var(--cream); opacity: 0.8; }

    .item-photo {
      display: inline-block;
      margin-top: clamp(8px, 1.6vh, 14px);
      background: #fff;
    }
    .item-photo img {
      display: block;
      width: auto;
      max-width: min(240px, 100%);
      height: auto;
      max-height: clamp(150px, 36vh, 360px);
    }

    .order-row .pill { align-self: center; justify-self: start; margin-top: 0; }
    .col-mid, .col-right { padding-top: 6px; }

    .empty-box {
      margin-top: 40px;
      padding: 30px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      color: var(--cream);
      text-align: center;
    }

    /* TOTAL + PLACE ORDER */
    .order-foot {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      margin-top: clamp(12px, 2.4vh, 26px);
      padding-top: clamp(10px, 2vh, 20px);
      border-top: 1px solid var(--line);
    }
    .order-foot__box {
      grid-column: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .total { font-size: 16px; font-weight: 900; color: #fff; }
    .total span { margin-left: 10px; color: var(--accent); }

    .btn {
      min-width: 110px;
      height: 40px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:hover { transform: translateY(-2px); background: var(--cream); }

    /* CONFIRMATION */
    .confirm {
      margin-top: 40px;
      padding: 32px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--cream);
    }
    .confirm h2 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
    .confirm p { margin-bottom: 8px; }
    .confirm .btn { margin-top: 16px; }

    @media (max-width: 760px) {
      .order-head, .order-row { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr) minmax(0, 0.9fr); gap: 10px; }
      .pill { min-width: 0; font-size: 11px; padding: 0 8px; }
      .item-title { font-size: 18px; }
      .order-foot { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr) minmax(0, 0.9fr); gap: 10px; }
    }
  </style>
</head>
<body id="top">

  <header class="nav">
    <nav class="nav__left" aria-label="Main navigation">
      <a href="shop.html" class="back-btn" aria-label="Back to shop">←</a>
      <a href="index.html" class="nav__link">HOME</a>
    </nav>

    <a href="index.html" class="nav__logo">ThriftNFit</a>

    <div class="nav__right">
      <a href="checkout.html?cart=1" class="icon-btn" aria-label="Your cart" title="Cart">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h3l2.4 11h11l2-8H6"/>
          <circle cx="9" cy="19.5" r="1.4"/>
          <circle cx="17" cy="19.5" r="1.4"/>
        </svg>
      </a>

      <div class="settings">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-expanded="false" title="Settings">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
          </svg>
        </button>

        <div class="menu" id="settingsMenu" hidden>
          <a class="menu__row menu__btn" href="contacts.html">Contacts</a>
          <a class="menu__row menu__btn" href="shipping.html?from=checkout">Shipping information</a>
        </div>
      </div>
    </div>
  </header>

  <main class="checkout">
    <div class="checkout__inner">

      <h1 class="checkout__title">ThriftNFit | Checkout</h1>

      <!-- Pindutin ang ADDRESS para pumunta sa Shipping information -->
      <a class="address-link" id="addressLink" href="shipping.html?from=checkout">ADDRESS:</a>
      <p class="address-text is-empty" id="addressText">Click ADDRESS to add your shipping information.</p>

      <section id="orderSection" aria-label="Your order">
        <div class="order-head">
          <span class="pill">Product order</span>
          <span class="pill">Quantity</span>
          <span class="pill">Price:</span>
        </div>

        <div id="orderRows"></div>

        <div class="order-foot" id="orderFoot">
          <div class="order-foot__box">
            <div class="total">TOTAL<span id="totalValue">₱0</span></div>
            <button type="button" class="btn" id="placeOrder">Place order</button>
          </div>
        </div>
      </section>

      <section class="confirm" id="confirmBox" hidden>
        <h2>Order placed! ✓</h2>
        <p id="confirmLine1"></p>
        <p id="confirmLine2"></p>
        <p>We ship within 2-3 days.</p>
        <a class="btn" href="shop.html">Continue shopping</a>
      </section>

    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const peso = (n) => "₱" + n.toLocaleString("en-PH");
    const CART_KEY = "tnf-cart";
    const SHIP_KEY = "tnf-shipping";

    // Same products as the shop page.
    const PRODUCTS = {
      "gray-carhartt": { name: "Gray T-Shirt Carhartt",   price: 200, img: "gray-carhartt.png" },
      "new-york-city": { name: "New York City T-Shirt",   price: 150, img: "new-york-city.png" },
      "liberty":       { name: "Liberty Striped T-Shirt", price: 100, img: "liberty-striped.png" },
      "doormats":      { name: "Doormats Only Hoodie",    price: 400, img: "doormats-only.png" },
      "in-god":        { name: "In God We Trust Hoodie",  price: 400, img: "in-god-we-trust.png" },
    };

    let toastTimer;
    function showToast(message) {
      const t = $("toast");
      t.textContent = message;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
    }

    function read(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    }
    function write(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ }
    }

    // Check out sa product page = ang produktong iyon lang ("buy now").
    // checkout.html?cart=1 = ang buong cart.
    const BUYNOW_KEY = "tnf-buynow";
    const valid = (i) => i && PRODUCTS[i.id] && i.qty > 0;
    const wantsCart = new URLSearchParams(location.search).get("cart") === "1";
    const buyNow = read(BUYNOW_KEY, null);
    const buyNowMode = !wantsCart && valid(buyNow);
    let cart = buyNowMode ? [buyNow] : read(CART_KEY, []).filter(valid);
    const shipping = read(SHIP_KEY, null);

    // ---------- address ----------
    function renderAddress() {
      const box = $("addressText");
      if (shipping && shipping.address) {
        box.classList.remove("is-empty");
        box.textContent = [shipping.fullName, shipping.address, shipping.country].filter(Boolean).join(" · ");
      }
    }

    // ---------- order ----------
    function renderOrder() {
      const rows = $("orderRows");
      rows.innerHTML = "";

      if (cart.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-box";
        empty.innerHTML = '<p>Your order is empty.</p><p style="margin-top:14px"><a class="btn" href="shop.html">Go to shop</a></p>';
        rows.appendChild(empty);
        $("orderFoot").hidden = true;
        document.querySelector(".order-head").hidden = true;
        return;
      }

      let total = 0;
      cart.forEach((item) => {
        const p = PRODUCTS[item.id];
        const line = p.price * item.qty;
        total += line;

        const row = document.createElement("div");
        row.className = "order-row";
        row.innerHTML = `
          <div class="col-product">
            <div class="item-title"></div>
            <div class="item-size"></div>
            <div class="item-photo"><img alt=""></div>
          </div>
          <div class="col-mid"><span class="pill"></span></div>
          <div class="col-right"><span class="pill"></span></div>`;
        row.querySelector(".item-title").textContent = "“" + p.name + "”";
        row.querySelector(".item-size").textContent = "Size " + item.size;
        const img = row.querySelector("img");
        img.alt = p.name;
        img.onerror = () => { img.parentElement.style.display = "none"; };
        img.src = "assets/" + p.img;
        row.querySelector(".col-mid .pill").textContent = item.qty;
        row.querySelector(".col-right .pill").textContent = peso(line);
        rows.appendChild(row);
      });

      $("totalValue").textContent = peso(total);
    }

    // ---------- place order ----------
    $("placeOrder").addEventListener("click", () => {
      if (cart.length === 0) {
        showToast("Your order is empty.");
        return;
      }
      if (!shipping || !shipping.address) {
        showToast("Please add your shipping address first.");
        $("addressLink").focus();
        return;
      }

      const count = cart.reduce((s, i) => s + i.qty, 0);
      const total = cart.reduce((s, i) => s + PRODUCTS[i.id].price * i.qty, 0);

      write("tnf-last-order", { items: cart, total, shipping, date: new Date().toISOString() });
      if (buyNowMode) {
        try { localStorage.removeItem(BUYNOW_KEY); } catch { /* ignore */ }
      } else {
        write(CART_KEY, []);
      }
      cart = [];

      $("orderSection").hidden = true;
      $("confirmLine1").textContent =
        "Thank you" + (shipping.fullName ? ", " + shipping.fullName : "") + "! " +
        count + " item" + (count === 1 ? "" : "s") + " · " + peso(total);
      $("confirmLine2").textContent = "Delivery address: " + shipping.address + (shipping.country ? ", " + shipping.country : "");
      $("confirmBox").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // ---------- settings menu ----------
    const settingsBtn = $("settingsBtn");
    const settingsMenu = $("settingsMenu");
    settingsBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const opening = settingsMenu.hidden;
      settingsMenu.hidden = !opening;
      settingsBtn.setAttribute("aria-expanded", String(opening));
    });
    document.addEventListener("click", (event) => {
      if (!settingsMenu.contains(event.target) && !settingsBtn.contains(event.target)) {
        settingsMenu.hidden = true;
        settingsBtn.setAttribute("aria-expanded", "false");
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      settingsMenu.hidden = true;
      settingsBtn.setAttribute("aria-expanded", "false");
    });

    renderAddress();
    renderOrder();
  })();
  </script>
</body>
</html>
