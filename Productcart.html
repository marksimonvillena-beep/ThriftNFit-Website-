<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products · ThriftNFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="products.css" />
</head>
<body>
  <header class="nav" id="top">
    <nav class="nav__left" aria-label="Primary">
      <a href="products.html" class="nav__link" aria-current="page">PRODUCTS</a>
      <a href="index.html#about" class="nav__link">ABOUT US</a>
    </nav>

    <a href="index.html" class="nav__logo" aria-label="ThriftNFit home">ThriftNFit</a>

    <div class="nav__right">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button class="icon-btn cart-btn" id="cartBtn" aria-label="Open cart">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h3l2.4 11h11l2-8H6"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
        <span class="badge" id="cartCount" hidden>0</span>
      </button>
      <div class="settings">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <div class="menu" id="settingsMenu" hidden>
          <label class="menu__row"><span>Light theme</span><input type="checkbox" id="themeToggle" /></label>
          <button class="menu__row menu__btn" id="clearCart">Clear cart</button>
        </div>
      </div>
    </div>
  </header>

  <div class="search-bar" id="searchBar" hidden>
    <input type="search" id="searchInput" placeholder="Search products…" autocomplete="off" />
    <button class="icon-btn" id="searchClose" aria-label="Close search">✕</button>
  </div>

  <main class="products-page">
    <h1 class="sr-only">Products</h1>
    <p class="empty" id="emptyMsg" hidden>No products match your search.</p>
    <div class="p-grid" id="productGrid"></div>
  </main>

  <!-- Product detail -->
  <dialog class="pm" id="productModal" aria-labelledby="pmName">
    <div class="pm__inner">
      <button class="pm__close" id="pmClose" type="button" aria-label="Close">✕</button>
      <div class="pm__img" id="pmImg"></div>
      <div class="pm__info">
        <h2 id="pmName"></h2>
        <p class="pm__price" id="pmPrice"></p>

        <fieldset class="pm__sizes">
          <legend>Size</legend>
          <div class="pm__chips" id="pmSizes"></div>
        </fieldset>

        <div class="pm__qty">
          <span>Quantity</span>
          <div class="qty">
            <button type="button" id="pmDec" aria-label="Decrease quantity">−</button>
            <span id="pmQty" aria-live="polite">1</span>
            <button type="button" id="pmInc" aria-label="Increase quantity">+</button>
          </div>
        </div>

        <p class="error" id="pmError" role="alert"></p>
        <button class="btn" type="button" id="pmAdd">Add to cart</button>
      </div>
    </div>
  </dialog>

  <div class="overlay" id="overlay" hidden></div>

  <aside class="drawer" id="cartDrawer" aria-label="Shopping cart" aria-hidden="true">
    <div class="drawer__head">
      <h3>Your cart</h3>
      <button class="icon-btn" id="cartClose" aria-label="Close cart">✕</button>
    </div>
    <ul class="drawer__list" id="cartList"></ul>
    <div class="drawer__foot">
      <div class="total"><span>Total</span><strong id="cartTotal">₱0.00</strong></div>
      <button class="btn" id="checkoutBtn">Checkout</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="products.js"></script>
</body>
</html>
