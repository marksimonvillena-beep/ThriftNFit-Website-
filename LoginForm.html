<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · ThriftNFit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Lahat ng style ng page na ito ay nandito na, hindi na kailangan ng ibang CSS file -->
  <style>
    body, .nav, .nav__link,
    button, input {
      font-family: "Poppins", system-ui, sans-serif;
    }

    body {
      background: radial-gradient(
        ellipse 80% 60% at 50% 35%,
        var(--bg-glow, #6b4c35) 0%,
        var(--bg, #3f2d20) 55%,
        var(--bg-edge, #2f2218) 100%
      ) fixed;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--cream, #f5f0e8);
      font-size: 40px;
      line-height: 1;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 0.7; }

    /* Kapag may logo image na, alisin ang kahon at text */
    .nav__logo.has-img { padding: 0; background: none; }
    .nav__logo #logoImg { display: block; height: 48px; width: auto; }

    .login-page {
      display: flex;
      justify-content: center;
      padding: clamp(120px, 20vh, 190px) 20px 60px;
    }

    /* ---------- CARD ---------- */
    .login-card {
      width: 100%;
      max-width: 476px;
      padding: 20px 22px 24px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
      color: #1e1e1e;
    }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .field label { font-size: 14px; font-weight: 700; }

    .field input {
      width: 100%;
      padding: 11px 16px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
      color: #1e1e1e;
      font-size: 15px;
      font-weight: 600;
    }
    .field input::placeholder { color: #b3b3b3; font-weight: 500; }
    .field input:focus,
    .input-group:focus-within { outline: 2px solid #2c2c2c; outline-offset: 1px; }

    .input-group {
      display: flex;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      overflow: hidden;
    }
    .field .input-group input { border: 0; border-radius: 0; flex: 1; min-width: 0; }
    .field .input-group input:focus { outline: none; }
    .toggle-pass {
      flex: none;
      padding: 0 14px;
      border: 0;
      background: #f3f3f3;
      border-left: 1px solid #d9d9d9;
      color: #444;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-pass:hover { background: #e9e9e9; }

    .field .err { font-size: 12px; font-weight: 500; color: #b3261e; }
    .field.has-error input,
    .field.has-error .input-group { border-color: #b3261e; }

    .signin-btn {
      width: 100%;
      margin-top: 4px;
      padding: 12px;
      border: 1px solid #2c2c2c;
      border-radius: 8px;
      background: #2c2c2c;
      color: #f5f5f5;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .signin-btn:hover { opacity: 0.85; }

    .forgot {
      display: inline-block;
      margin-top: 22px;
      padding: 0;
      border: 0;
      background: none;
      color: #1e1e1e;
      font-size: 14px;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }
    .forgot:hover { color: #555; }

    .form-msg { margin-top: 14px; font-size: 14px; font-weight: 600; text-align: center; }
    .form-msg.ok  { color: #2e7d32; }
    .form-msg.bad { color: #b3261e; }

    /* Forgot password popup */
    .reset-dialog {
      width: min(420px, calc(100vw - 32px));
      padding: 22px;
      border: 0;
      border-radius: 10px;
      color: #1e1e1e;
    }
    .reset-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    .reset-dialog h2 { font-size: 20px; margin-bottom: 6px; }
    .reset-dialog p  { font-size: 14px; line-height: 1.5; margin-bottom: 14px; color: #555; }
    .reset-dialog .actions { display: flex; gap: 10px; margin-top: 4px; }
    .reset-dialog .actions button {
      flex: 1;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #2c2c2c;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .reset-dialog .primary { background: #2c2c2c; color: #fff; }
    .reset-dialog .ghost   { background: #fff; color: #2c2c2c; }
  </style>
</head>
<body>

  <header class="nav">
    <nav class="nav__left" aria-label="Main navigation">
      <a href="index.html" class="back-btn" aria-label="Back to home">←</a>
    </nav>

    <!-- Logo: ilagay ang exported logo sa assets/logo.png. Kung wala pa, text muna ang lalabas. -->
    <a href="index.html" class="nav__logo" id="logoLink" aria-label="ThriftNFit">
      <img id="logoImg" src="assets/logo.png" alt="ThriftNFit" height="48" hidden>
      <span id="logoText">ThriftNFit</span>
    </a>

    <div class="nav__right"></div>
  </header>

  <main class="login-page">
    <form class="login-card" id="loginForm" novalidate>

      <div class="field" id="f-email">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Example@gmail.com" autocomplete="email">
        <span class="err" aria-live="polite"></span>
      </div>

      <div class="field" id="f-password">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" placeholder="Enter your Password" autocomplete="current-password">
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <span class="err" aria-live="polite"></span>
      </div>

      <button type="submit" class="signin-btn">Sign In</button>
      <p class="form-msg" id="formMsg" role="status" hidden></p>

      <button type="button" class="forgot" id="forgotBtn">Forgot password?</button>
    </form>
  </main>

  <dialog class="reset-dialog" id="resetDialog">
    <form method="dialog" id="resetForm" novalidate>
      <h2>Forgot password?</h2>
      <p>Enter your email and we'll send you a link to reset your password.</p>
      <div class="field" id="f-resetEmail" style="margin-bottom:14px">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" placeholder="Example@gmail.com" autocomplete="email">
        <span class="err" aria-live="polite"></span>
      </div>
      <p id="resetMsg" role="status" hidden style="color:#2e7d32;font-weight:600;margin-bottom:10px"></p>
      <div class="actions">
        <button type="button" class="ghost" id="resetClose">Close</button>
        <button type="submit" class="primary">Send reset link</button>
      </div>
    </form>
  </dialog>

  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };

    // Logo image (kung may assets/logo.png)
    (function () {
      var img = $("logoImg");
      function show() {
        img.hidden = false;
        $("logoText").hidden = true;
        $("logoLink").classList.add("has-img");
      }
      if (img.complete && img.naturalWidth > 0) show();
      else img.addEventListener("load", show);
    })();

    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function setError(id, text) {
      var box = $("f-" + id);
      box.classList.add("has-error");
      box.querySelector(".err").textContent = text;
    }
    function clearError(id) {
      var box = $("f-" + id);
      box.classList.remove("has-error");
      box.querySelector(".err").textContent = "";
    }
    ["email", "password"].forEach(function (id) {
      $(id).addEventListener("input", function () { clearError(id); $("formMsg").hidden = true; });
    });

    // Kung naka-login na, ipakita ang email
    try {
      var user = JSON.parse(localStorage.getItem("tnf-user"));
      if (user && user.email) $("email").value = user.email;
    } catch (e) { /* ignore */ }

    // Show / hide password
    $("togglePass").addEventListener("click", function () {
      var pw = $("password");
      var show = pw.type === "password";
      pw.type = show ? "text" : "password";
      this.textContent = show ? "Hide" : "Show";
      this.setAttribute("aria-pressed", String(show));
      this.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    // ---------- Sign in ----------
    $("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = $("email").value.trim();
      var password = $("password").value;
      var ok = true, firstBad = null;
      function bad(id, msg) { setError(id, msg); ok = false; if (!firstBad) firstBad = $(id); }

      if (!EMAIL_RE.test(email)) bad("email", "Please enter a valid email address.");
      if (password.length < 6) bad("password", "Password must be at least 6 characters.");
      if (!ok) { firstBad.focus(); return; }

      try { localStorage.setItem("tnf-user", JSON.stringify({ email: email, date: new Date().toISOString() })); }
      catch (err) { /* ignore */ }

      var msg = $("formMsg");
      msg.className = "form-msg ok";
      msg.textContent = "Signed in! Redirecting…";
      msg.hidden = false;
      setTimeout(function () { location.href = "index.html"; }, 800);
    });

    // ---------- Forgot password ----------
    var dlg = $("resetDialog");
    function openDlg() {
      $("resetEmail").value = $("email").value.trim();
      clearError("resetEmail");
      $("resetMsg").hidden = true;
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    }
    function closeDlg() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
    $("forgotBtn").addEventListener("click", openDlg);
    $("resetClose").addEventListener("click", closeDlg);
    $("resetEmail").addEventListener("input", function () { clearError("resetEmail"); $("resetMsg").hidden = true; });
    $("resetForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = $("resetEmail").value.trim();
      if (!EMAIL_RE.test(v)) { setError("resetEmail", "Please enter a valid email address."); $("resetEmail").focus(); return; }
      $("resetMsg").textContent = "If " + v + " has an account, a reset link will be sent.";
      $("resetMsg").hidden = false;
    });
  })();
  </script>
</body>
</html>
